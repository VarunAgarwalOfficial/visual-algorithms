<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Not found · Visual algorithms</title>
    <style>
      body {
        max-width: 36rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
        background: light-dark(#f6f5f1, #131516);
        color: light-dark(#1d1f21, #e8e6e1);
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }
      p {
        color: light-dark(#5b6066, #a3a8ad);
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p>There is nothing at this address. The demos all live on one page.</p>
    <p><a id="home" href="/">Go to Visual algorithms</a></p>
    <script>
      // This page is served for any missing path, however deep, so a relative link would
      // be wrong. On a github.io project site the first path segment is the site's folder.
      const folder = window.location.pathname.split('/')[1];
      const project = window.location.hostname.endsWith('.github.io') && folder;
      document.getElementById('home').href = project ? `/${folder}/` : '/';
    </script>
  </body>
</html>
